<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שוברים">
<meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="coupontracker.webmanifest">
<link rel="apple-touch-icon" href="coupontracker-180.png">
<link rel="icon" href="coupontracker-180.png">
<title>שוברים</title>
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#1C1C1E; --ink2:#48484A; --muted:#6C6C70;
  --sep:#3C3C4329; --line:#E5E5EA; --fill:#7676801F;
  --up:#248A3D; --down:#D70015; --tint:#007AFF; --chev:#C7C7CC;
  --bar:#F9F9F9D9; --toast:#3A3A3CF2; --ontoast:#FFFFFF;
  --ease:cubic-bezier(.32,.72,0,1); --blur:saturate(1.6) blur(16px);
  --num: ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"SF Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  --txt: -apple-system,system-ui,"SF Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
  /* השלמות שלא הוגדרו במפרט */
  --barSolid:#F9F9F9; --pill:#FFFFFF; --fill2:#78788029;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --ink2:#D1D1D6; --muted:#98989F;
    --line:#38383A; --up:#30D158; --down:#FF453A; --tint:#0A84FF; --chev:#48484A;
    --sep:#54545899; --fill:#7676803D; --bar:#161618D9; --barSolid:#161618; --pill:#636366; --fill2:#78788052;
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --ink2:#D1D1D6; --muted:#98989F;
  --line:#38383A; --up:#30D158; --down:#FF453A; --tint:#0A84FF; --chev:#48484A;
  --sep:#54545899; --fill:#7676803D; --bar:#161618D9; --barSolid:#161618; --pill:#636366; --fill2:#78788052;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;min-height:100%;width:100%;background:var(--bg);color:var(--ink);font:17px/1.3 var(--txt);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.sel{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
[hidden]{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
svg{flex:none}

/* ---------- shell / pages ---------- */
#shell{position:fixed;inset:0;overflow:hidden;transform-origin:50% 45%;background:var(--bg)}
#pages{position:absolute;inset:0;overflow:hidden}
.page{position:absolute;inset:0;background:var(--bg);overflow:hidden;contain:strict}
.scroller{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;padding-top:calc(var(--sat) + 44px);padding-bottom:calc(var(--sab) + 49px + 28px)}
#detail .scroller{padding-bottom:calc(var(--sab) + 32px)}
.navbar{position:absolute;top:0;left:0;right:0;z-index:5;height:calc(var(--sat) + 44px);padding:var(--sat) 8px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.navbar>.bg{position:absolute;inset:0;background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);opacity:0;pointer-events:none}
.navbar>.bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--sep)}
.navbar .ttl{position:relative;font-weight:600;font-size:17px;opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw;text-align:center}
.nb{position:relative;color:var(--tint);font-size:17px;height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nb.b{font-weight:600}
.nb:disabled{color:var(--muted)}
.nb:active{opacity:.4}
.start{justify-self:start}.end{justify-self:end}
.lt{padding:2px 16px 10px}
.lt h1{margin:0;font-size:34px;line-height:41px;font-weight:700}
.moving .navbar>.bg,.moving .tabbar{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--barSolid)}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;height:calc(49px + var(--sab));padding-bottom:var(--sab);display:flex;background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.tabbar::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:10px;font-weight:500;text-align:center}
.tab svg{width:28px;height:28px}
.tab.on{color:var(--tint)}

/* ---------- panels & rows ---------- */
.panel{background:var(--surface);border-radius:14px;margin:0 16px 22px;overflow:hidden}
.sh{margin:0 32px 6px;font-size:13px;color:var(--muted)}
.sh.warn{color:var(--down);font-weight:600}
.sf{margin:-14px 32px 22px;font-size:13px;color:var(--muted);line-height:1.35}
.row{display:grid;grid-template-columns:10px 1fr auto;column-gap:12px;align-items:center;min-height:60px;padding:10px 16px;position:relative;width:100%;text-align:right}
.row.s{min-height:44px;padding-top:8px;padding-bottom:8px}
.row+.row::before{content:"";position:absolute;top:0;inset-inline-start:38px;inset-inline-end:0;height:.5px;background:var(--sep)}
.tap:active{background:var(--fill)}
.spine{width:4px;height:30px;border-radius:2px;justify-self:center}
.spine.up{background:var(--up)}.spine.tint{background:var(--tint)}
.amt.short{font-weight:600;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.bal .v.txt{font-size:30px;line-height:36px;overflow-wrap:anywhere}.spine.down{background:var(--down)}.spine.mute{background:var(--chev)}
.rc{min-width:0}
.rt{font-size:17px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt.wrap{white-space:normal;overflow-wrap:anywhere}
.rs{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs.down{color:var(--down)}
.rv{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:17px}
.amt{font-weight:600;color:var(--ink)}
.chev{width:8px;height:13px;color:var(--chev)}
.off .rt,.off .amt{color:var(--muted)}
.lnk{color:var(--tint)}.red{color:var(--down)}
.row.act{grid-template-columns:10px 1fr;color:var(--tint)}
.row.act.red{color:var(--down)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.empty .btn{margin-top:18px}

/* summary */
.sum{padding:16px 16px 18px}
.wwrap{margin:0 16px 22px}
.wallet{display:flex;flex-direction:column;touch-action:pan-y}
.wdots{display:flex;justify-content:center;gap:7px;padding-top:12px}
.wdots i{width:7px;height:7px;border-radius:50%;background:var(--chev)}
.wdots i.on{background:var(--ink2)}
.wcard{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;height:184px;margin-bottom:-118px;padding:14px 16px 16px;border-radius:16px;color:#fff;text-align:right;background:var(--wc);box-shadow:0 -1px 0 rgba(255,255,255,.18) inset,0 -6px 14px rgba(0,0,0,.14);overflow:hidden;-webkit-tap-highlight-color:transparent}
.wcard:last-child{margin-bottom:0}
.wcard:first-child{box-shadow:0 -1px 0 rgba(255,255,255,.18) inset}
.wcard::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .15s;pointer-events:none}
.wcard:active::after{opacity:.12}
.wcard .wt{display:flex;align-items:center;gap:8px;min-height:38px}
.wcard .wn{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wv{font-family:var(--num);font-size:20px;font-weight:700;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.wcard .wp{font-size:12px;background:rgba(0,0,0,.28);border-radius:10px;padding:2px 8px;white-space:nowrap}
.wcard .wb{display:flex;flex-direction:column;gap:8px}
.wcard .wbig{font-family:var(--num);font-size:34px;line-height:38px;font-weight:700;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;text-align:right}
.wcard .ws{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:rgba(255,255,255,.88)}
.wcard .ws span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .wbar{height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.wcard .wbar i{display:block;height:100%;background:#fff;border-radius:2px}
.wcard:last-child .wt .wv{visibility:hidden}
.wcard:last-child .wp{display:none}
#list .wcard .rt{color:#fff;margin:0}#list .wcard .rs{color:rgba(255,255,255,.88);margin:0}
.sum .l{font-size:13px;color:var(--muted)}
.sum .v{font-size:40px;line-height:46px;font-weight:700;margin:2px 0 2px}
.sum .s{font-size:15px;color:var(--ink2)}

/* search */
.search{margin:0 16px 18px;height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;padding:0 8px;gap:6px;color:var(--muted)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);outline:none;height:100%;min-width:0;padding:0}
.search input::placeholder{color:var(--muted)}
.qx{width:22px;height:22px;border-radius:50%;background:var(--muted);color:var(--surface);display:flex;align-items:center;justify-content:center;opacity:.7}
.mark{background:none;color:var(--tint);font-weight:600}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:14px;font-size:17px;font-weight:600;width:100%;text-align:center}
.btn.pri{background:var(--tint);color:#fff}
.btn.sec{background:var(--surface);color:var(--tint)}
.btn:active{opacity:.6}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 22px}
.btns.one{grid-template-columns:1fr}

/* segmented & switch */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;height:32px;min-width:170px}
.seg .knob{position:absolute;top:2px;bottom:2px;left:0;border-radius:7px;background:var(--pill)}
.seg button{position:relative;font-size:13px;font-weight:500;border-radius:7px;text-align:center;padding:0 10px;white-space:nowrap}
.seg button.on{font-weight:600}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill2);flex:none}
.sw .on{position:absolute;inset:0;border-radius:16px;background:var(--up)}
.sw .k{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px #0000000F}

/* forms */
.f{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:14px;min-height:50px;padding:0 16px;position:relative}
.f.r{grid-template-columns:1fr auto}
.f.one{grid-template-columns:1fr}
.f+.f::before,.f+.row::before,.row+.f::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;height:.5px;background:var(--sep)}
.f label{color:var(--ink);white-space:nowrap}
.f input,.f textarea{border:0;background:none;font:inherit;color:var(--ink);outline:none;width:100%;min-width:0;padding:14px 0;margin:0;border-radius:0;-webkit-appearance:none;appearance:none}
.f input.e{text-align:left}
.f input::placeholder,.f textarea::placeholder{color:var(--chev)}
.f textarea{resize:none;min-height:110px;line-height:1.35}
.f input[type=date]{min-height:48px;text-align:left}
.f input[type=date]::-webkit-date-and-time-value{text-align:left}
.ftip{font-size:13px;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px}
.thumbs:empty{display:none}
.th{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--fill)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.thx{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#000000A0;color:#fff;display:flex;align-items:center;justify-content:center}
.pastebox{padding:0 16px 14px}
.scanst{padding:12px 16px 14px;font-size:15px;color:var(--ink2);line-height:1.4;border-top:.5px solid var(--sep)}
.scanst b{color:var(--ink);font-weight:600}
.scanst pre{white-space:pre-wrap;font:13px/1.4 var(--txt);color:var(--muted);background:var(--fill);border-radius:10px;padding:10px;margin:8px 0 0;max-height:220px;overflow:auto;direction:rtl;unicode-bidi:plaintext}
.scanst .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--fill2);border-top-color:var(--tint);border-radius:50%;vertical-align:-2px;margin-left:8px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.f.auto input,.f.auto textarea{background:color-mix(in srgb,var(--tint) 12%,transparent);border-radius:8px;padding-inline:8px}
.pastebox textarea{width:100%;min-height:120px;border:0;border-radius:10px;background:var(--fill);font:inherit;color:var(--ink);padding:10px;outline:none;resize:none;margin-bottom:10px}
.rmb{width:22px;height:22px;border-radius:50%;background:var(--down);color:#fff;display:flex;align-items:center;justify-content:center;justify-self:center}

/* ---------- detail ---------- */
#dim{position:fixed;inset:0;z-index:39;background:#000;opacity:0;pointer-events:none;visibility:hidden}
#detail{position:fixed;inset:0;z-index:40;background:var(--bg);visibility:hidden;overflow:hidden}
.hero{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:4px 16px 0;margin-bottom:6px;scrollbar-width:none;overscroll-behavior-x:contain}
.hero::-webkit-scrollbar{display:none}
.hero img{flex:none;width:100%;height:230px;object-fit:cover;border-radius:14px;scroll-snap-align:center;background:var(--fill);display:block}
.hero.multi img{width:86%}
.dlt h1{font-size:30px;line-height:36px;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:10px;background:var(--fill);color:var(--ink2);margin-top:8px}
.pill.active{color:var(--up)}.pill.soon{color:var(--down)}.pill.used,.pill.expired{color:var(--muted)}
.bal{padding:16px}
.bal .l{font-size:13px;color:var(--muted)}
.bal .v{font-size:40px;line-height:46px;font-weight:700}
.bal .s{font-size:15px;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:var(--fill);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tint);border-radius:3px}
.code{padding:18px 16px 16px;text-align:center;display:flex;flex-direction:column;align-items:center}
.code .c{font-size:28px;line-height:34px;font-weight:600;letter-spacing:.5px;word-break:break-all;text-align:center;color:var(--ink)}
.code .c:active{opacity:.5}
.code .h{font-size:13px;color:var(--muted);margin:4px 0 14px}
.bc{margin-top:14px;background:#fff;border-radius:12px;padding:16px;display:flex;justify-content:center;width:100%}
.bc svg{display:block;width:100%;max-width:240px;height:auto}
.bc.c128 svg{max-width:none;height:96px}
.notes{padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.dsearch{margin:10px 16px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--fill);color:var(--ink);font-size:15px;white-space:nowrap;text-align:center}
.chip:active{opacity:.5}
.chip.on{background:var(--tint);color:#fff}
.chip .num{opacity:.6;font-size:13px}
.lcats{margin:-6px 0 14px;padding:0 16px}
.dcats{padding:12px 16px 4px}
.catbox{padding:14px 16px;display:grid;gap:10px}
.catbox .t{font-weight:600}
.catbox .d{font-size:15px;color:var(--ink2);line-height:1.35}
.catbox .btn{height:44px;font-size:16px}
.foot{text-align:center;font-size:13px;color:var(--muted);margin:-6px 16px 24px}

/* ---------- sheets ---------- */
.sheetroot{position:fixed;inset:0;z-index:60;visibility:hidden}
.sheetroot .scrim{position:absolute;inset:0;background:#000;opacity:0}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:12px 12px 0 0;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100% - var(--sat) - 10px)}
.sheet.full{top:calc(var(--sat) + 10px)}
.sbar{flex:none;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px 0;position:relative}
.sbar .st{font-weight:600}
.grab{position:absolute;top:5px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--chev)}
.sbody{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;padding:10px 0 calc(var(--sab) + 24px)}
.sheet.mini .sbody{flex:none}
#acts .sheet{background:transparent;border-radius:0;padding:0 8px calc(var(--sab) + 8px)}
.ag{background:var(--surface);border-radius:14px;overflow:hidden;margin-top:8px}
.at{padding:14px 16px;text-align:center;font-size:13px;color:var(--muted)}
.ab{display:flex;width:100%;height:57px;align-items:center;justify-content:center;font-size:20px;color:var(--tint);position:relative;text-align:center}
.at+.ab::before,.ab+.ab::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.ab.red{color:var(--down)}.ab.b{font-weight:600}
.ab:active{background:var(--fill)}

/* ---------- viewer / barcode / lock / toast ---------- */
#viewer{position:fixed;inset:0;z-index:80;visibility:hidden;touch-action:none}
#viewer .vbg{position:absolute;inset:0;background:#000;opacity:0}
#viewer .vs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#viewer .vs img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#viewer .vx{position:absolute;top:calc(var(--sat) + 8px);left:12px;width:36px;height:36px;border-radius:50%;background:#FFFFFF2E;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
#viewer .vn{position:absolute;top:calc(var(--sat) + 16px);right:0;left:0;text-align:center;color:#fff;font-size:15px;pointer-events:none;z-index:2}
#bcfull{position:fixed;inset:0;z-index:85;background:#fff;color:#000;visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 20px) 16px calc(var(--sab) + 20px);opacity:0}
#bcfull svg{width:100%;max-width:min(92vw,62vh);height:auto}
#bcfull.c128 svg{max-width:none;height:34vh}
#bcfull .c{font-size:26px;font-weight:600;margin-top:22px;word-break:break-all;text-align:center}
#bcfull .h{font-size:13px;color:#6C6C70;margin-top:10px}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);visibility:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 64px) 0 calc(var(--sab) + 24px)}
#lock h2{margin:0;font-size:22px;font-weight:600}
#lock .sub{font-size:15px;color:var(--muted);margin-top:8px;min-height:20px;text-align:center;padding:0 24px}
#lock .sub.err{color:var(--down)}
.dots{display:flex;gap:18px;margin:28px 0 auto;direction:ltr}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.f{background:var(--ink)}
.dots.busy{opacity:.35}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;direction:ltr;margin-top:32px}
.pad button{width:78px;height:78px;border-radius:50%;background:var(--fill);font:400 34px/1 var(--num);color:var(--ink);text-align:center}
.pad button:active{background:var(--chev)}
.pad .ghost{background:none;font:17px var(--txt);color:var(--ink)}
.pad .ghost:active{background:none;opacity:.4}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 49px + 14px);z-index:120;display:flex;justify-content:center;pointer-events:none;visibility:hidden}

/* ======================= lock ======================= */
const Lock = {
  code: '', opts: null, resolve: null, busy: false, visible: false,
  init() {
    this.el = $('#lock'); this.dots = $('#ldots');
    $('#lpad').innerHTML = ['1','2','3','4','5','6','7','8','9','c','0','d'].map(k => k === 'c' ? `<button class="ghost" data-k="c" id="lcancel">ביטול</button>` : k === 'd' ? `<button class="ghost" data-k="d" aria-label="מחיקה"><svg width="26" height="20" viewBox="0 0 26 20"><path d="M8 2h15a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8l-7-8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m12 7 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>` : `<button data-k="${k}">${k}</button>`).join('');
    $('#lpad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k; if (k === 'c') this.finish(null); else this.key(k === 'd' ? 'del' : k); });
    document.addEventListener('keydown', e => { if (!this.visible) return; if (/^\d$/.test(e.key)) this.key(e.key); else if (e.key === 'Backspace') this.key('del'); else if (e.key === 'Escape' && this.opts?.cancel) this.finish(null); });
    this.sp = new Spring({ scale: 1, response: .36, onUpdate: o => { this.el.style.opacity = String(o); }, onRest: o => { if (!o) this.el.style.visibility = 'hidden'; } });
  },
  ask(opts) {
    return new Promise(res => {
      this.opts = opts; this.resolve = res; this.code = ''; this.busy = false;
      $('#lttl').textContent = opts.title; const s = $('#lsub'); s.textContent = opts.err || opts.sub || ''; s.classList.toggle('err', !!opts.err);
      $('#lcancel').style.visibility = opts.cancel ? '' : 'hidden';
      this.paint();
      if (!this.visible) { this.visible = true; document.activeElement?.blur?.(); this.el.style.visibility = 'visible'; this.sp.jump(opts.instant ? 1 : 0); this.sp.to(1); }
    });
  },
  paint() { $$('i', this.dots).forEach((d, i) => d.classList.toggle('f', i < this.code.length)); this.dots.classList.toggle('busy', this.busy); },
  key(k) {
    if (this.busy || !this.resolve) return;
    if (k === 'del') this.code = this.code.slice(0, -1); else if (this.code.length < 6) this.code += k;

  },
  async submit() {
    const c = this.code; this.busy = true; this.paint();
    if (this.opts.check) {
      await sleep(30); const ok = await this.opts.check(c);
      if (!ok) { this.busy = false; this.code = ''; this.paint(); shake(this.dots); const s = $('#lsub'); s.textContent = this.opts.wrong || 'קוד שגוי'; s.classList.add('err'); return; }
    }
    this.busy = false; this.finish(c);
  },
  finish(c) { const r = this.resolve; this.resolve = null; r?.(c); },
  setBusy(text) { this.busy = true; this.paint(); $('#lsub').textContent = text; $('#lsub').classList.remove('err'); },
  close() { this.visible = false; this.busy = false; this.resolve = null; this.sp.to(0); }
};
async function chooseCode() {
  let err = '';
  for (;;) {
    const a = await Lock.ask({ title: 'בחירת קוד', sub: 'קוד בן שש ספרות. אין דרך לשחזר קוד שנשכח — רק מגיבוי.', err, cancel: true }); if (a == null) return null;
    const b = await Lock.ask({ title: 'אימות הקוד', sub: 'הזנה חוזרת של אותו קוד', cancel: true }); if (b == null) return null;
    if (a === b) return a; shake(Lock.dots); err = 'הקודים לא תאמו, נסה שוב';
  }
}
async function verifyCode(title) {
  const salt = b64d(Store.rec.lock.salt), enc = Store.rec.enc;
  return Lock.ask({ title, cancel: true, check: async c => { try { await decStr(await deriveKey(c, salt), enc); return true; } catch { return false; } } });
}
async function enableLock() {
  const code = await chooseCode(); if (code == null) { Lock.close(); renderSettings(); return; }
  Lock.setBusy('מצפין…');
  try {
    const salt = crypto.getRandomValues(new Uint8Array(16)); const key = await deriveKey(code, salt);
    await Img.rekey(null, key);
    Store.rec.lock = { salt: b64(salt), iter: ITER }; Store.key = key; await Store.save();
    Toast.show('הנעילה הופעלה');
  } catch (e) { console.error(e); Toast.show('הפעלת הנעילה נכשלה'); }
  Lock.close(); renderSettings();
}
async function disableLock() {
  const c = await verifyCode('הזנת הקוד הנוכחי'); if (c == null) { Lock.close(); renderSettings(); return; }
  Lock.setBusy('מפענח…');
  try { await Img.rekey(Store.key, null); Store.key = null; delete Store.rec.lock; await Store.save(); Toast.show('הנעילה בוטלה'); }
  catch (e) { console.error(e); Toast.show('ביטול הנעילה נכשל'); }
  Lock.close(); renderSettings();
}
async function changeCode() {

  const code = await chooseCode(); if (code == null) { Lock.close(); return; }

    await Img.rekey(Store.key, key); Store.rec.lock = { salt: b64(salt), iter: ITER }; Store.key = key; await Store.save();

}
async function unlockFlow(instant) {

function lockNow() {
  if (!Store.locked) return;
  Store.key = null; Store.data = { vouchers: [], lastBackup: null }; Img.revokeAll();
  if (Detail.isOpen || Detail.id) { Detail.isOpen = false; [Detail.p, Detail.tx, Detail.ty].forEach(s => s.jump(0)); Detail.settle(); }
  [Editor.sheet, Redeem.sheet, Acts].forEach(s => { if (s.isOpen) { s.isOpen = false; s.sp.jump(s.h); s.mv.end(); s.root.style.visibility = 'hidden'; } });
  if (Viewer.isOpen) { Viewer.isOpen = false; Viewer.op.jump(0); Viewer.settle(); }
  BcFull.sp.to(0, { instant: true });
  $('#q').value = ''; renderAll(); unlockFlow(true);
}

/* ======================= backup ======================= */
async function exportBackup() {
  if (!Store.data.vouchers.length) { Toast.show('אין שוברים לגיבוי'); return; }
  Toast.show('מכין גיבוי…');
  try {
    const images = {};
    for (const v of Store.data.vouchers) for (const id of v.imgs) { const b = await Img.raw(id); if (b) images[id] = b64(b); }
    const payload = { data: Store.data, images };
    const out = { app: 'coupontracker', v: 1, created: new Date().toISOString() };
    if (Store.key) out.enc = { salt: Store.rec.lock.salt, iter: ITER, ...(await encStr(Store.key, JSON.stringify(payload))) };
    else Object.assign(out, payload);
    const name = `coupontracker-backup-${todayStr()}.json`;
    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    const file = new File([blob], name, { type: 'application/json' });
    const mb = (blob.size / 1048576).toFixed(1);
    const mark = () => { Store.data.lastBackup = Date.now(); Store.save(); renderSettings(); };
    const download = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); mark(); };
    const items = [];
    if (navigator.canShare && navigator.canShare({ files: [file] })) items.push({ label: 'שמירה בקבצים / שיתוף', fn: () => navigator.share({ files: [file] }).then(mark).catch(e => { if (e.name !== 'AbortError') download(); }) });
    items.push({ label: 'הורדת הקובץ', fn: download });
    Toast.hide();
    await actionSheet(`הגיבוי מוכן · ${Object.keys(images).length} תמונות · ${mb}MB${Store.key ? ' · מוצפן בקוד הנעילה' : ''}`, items);
  } catch (e) { console.error(e); Toast.show('יצירת הגיבוי נכשלה'); }
}
async function importBackup(file) {
  let o; try { o = JSON.parse(await file.text()); } catch { Toast.show('הקובץ אינו גיבוי תקין'); return; }
  if (!o || (o.app !== 'coupontracker' && o.app !== 'shovarim')) { Toast.show('הקובץ אינו גיבוי של האפליקציה'); return; }
  let payload = null;
  if (o.enc) {
    const salt = b64d(o.enc.salt);
    const c = await Lock.ask({ title: 'קוד הגיבוי', sub: 'הגיבוי מוצפן. יש להזין את הקוד שהיה פעיל בזמן יצירתו.', cancel: true, check: async c => { try { payload = JSON.parse(await decStr(await deriveKey(c, salt), o.enc)); return true; } catch { return false; } } });
    Lock.close(); if (c == null) return;
  } else payload = { data: o.data, images: o.images };
  const vs = (payload.data && Array.isArray(payload.data.vouchers) ? payload.data.vouchers : []).map(cleanV);
  const images = payload.images && typeof payload.images === 'object' ? payload.images : {};
  const cur = Store.data.vouchers.length;
  const i = await actionSheet(`בגיבוי ${vs.length} שוברים. ${cur ? `השחזור יחליף את ${cur} השוברים שבמכשיר.` : ''}`, [{ label: 'שחזור', red: !!cur }]);
  if (i !== 0) return;
  try {
    await IDB.clear(); Img.revokeAll();
    for (const v of vs) { v.imgs = v.imgs.filter(id => typeof images[id] === 'string'); for (const id of v.imgs) await Img.putBuf(id, b64d(images[id]).buffer); }
    Store.data = { vouchers: vs, lastBackup: Number.isFinite(payload.data?.lastBackup) ? payload.data.lastBackup : null };
    await Store.save(); renderAll(); Toast.show(`שוחזרו ${N(vs.length)} שוברים`);
  } catch (e) { console.error(e); Toast.show('השחזור נכשל'); }
}
async function wipeAll() {
  const i = await actionSheet('כל השוברים, התמונות וקוד הנעילה יימחקו מהמכשיר. אין דרך לבטל.', [{ label: 'מחיקת כל הנתונים', red: true }]);
  if (i !== 0) return;
  await IDB.clear(); Img.revokeAll(); localStorage.removeItem(KEY);
  Store.key = null; Store.load(); renderAll(); Toast.show('כל הנתונים נמחקו');
}
async function cleanupOrphans() {
  try { const used = new Set(Store.data.vouchers.flatMap(v => v.imgs)); for (const k of await IDB.keys()) if (!used.has(k)) await IDB.del(k); } catch {}
}

/* ======================= settings ======================= */
function applyTheme() {
  const t = Store.ui.theme, r = document.documentElement;
  if (t === 'light' || t === 'dark') r.dataset.theme = t; else delete r.dataset.theme;
  const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  $$('meta[name=theme-color]').forEach(m => { m.content = dark ? '#161618' : '#F9F9F9'; });
}
function renderSettings() {
  const vs = Store.data.vouchers; const nImg = vs.reduce((s, v) => s + v.imgs.length, 0);
  const lb = Store.data.lastBackup;
  let h = `<div class="sh">מראה</div><div class="panel"><div class="row"><i></i><div class="rc"><div class="rt">ערכת צבע</div></div>${segHTML('theme', [['auto', 'אוטומטי'], ['light', 'בהיר'], ['dark', 'כהה']], Store.ui.theme)}</div></div><div class="sf">„אוטומטי” עובר בין בהיר לכהה לפי הגדרות האייפון.</div>`;
  h += `<div class="sh">אבטחה</div><div class="panel"><div class="row"><i></i><div class="rc"><div class="rt">נעילה בקוד</div></div>${swHTML('lock', Store.locked)}</div>${Store.locked && Store.key ? `<button class="row tap" id="schange"><i></i><div class="rc"><div class="rt">החלפת קוד</div></div><div class="rv">${CHEV}</div></button><button class="row tap" id="slocknow"><i></i><div class="rc"><div class="rt">נעילה עכשיו</div></div><div class="rv">${CHEV}</div></button>` : ''}</div><div class="sf">${Store.locked ? `השוברים והתמונות מוצפנים במכשיר (AES-GCM, מפתח שנגזר מהקוד ב־PBKDF2 עם ${N('250,000')} איטרציות). האפליקציה ננעלת אחרי דקה ברקע.` : 'כשהנעילה פעילה, כל הנתונים והתמונות נשמרים מוצפנים ונפתחים רק עם הקוד.'}</div>`;
  h += `<div class="sh">גיבוי</div><div class="panel"><button class="row tap" id="sexport"><i></i><div class="rc"><div class="rt">ייצוא גיבוי</div><div class="rs">${lb ? `גיבוי אחרון ${N(fmtTs(lb))}` : 'עוד לא בוצע גיבוי'}</div></div><div class="rv">${CHEV}</div></button><button class="row tap" id="simport"><i></i><div class="rc"><div class="rt">שחזור מגיבוי</div></div><div class="rv">${CHEV}</div></button></div><div class="sf">קובץ JSON אחד שכולל את כל השוברים והתמונות. הנתונים קיימים רק במכשיר הזה — מחיקת האפליקציה ממסך הבית מוחקת אותם, לכן כדאי לגבות מדי פעם.${Store.locked ? ' כשהנעילה פעילה הגיבוי מוצפן באותו קוד.' : ''}</div>`;
  h += `<div class="sh">אחסון</div><div class="panel"><div class="row"><i></i><div class="rc"><div class="rt">שוברים</div></div><div class="rv">${N(vs.length)}</div></div><div class="row"><i></i><div class="rc"><div class="rt">תמונות</div></div><div class="rv">${N(nImg)}</div></div><div class="row"><i></i><div class="rc"><div class="rt">נפח בשימוש</div></div><div class="rv" id="susage">—</div></div></div>`;
  h += `<div class="panel"><button class="row act red tap" id="swipe"><i></i><div>מחיקת כל הנתונים</div></button></div><div class="foot">גרסה ${N(VERSION)}</div>`;
  const el = $('#settings'); el.innerHTML = h; initSegs(el);
  navigator.storage?.estimate?.().then(e => { const u = $('#susage'); if (u && e && e.usage != null) u.innerHTML = N((e.usage / 1048576).toFixed(1) + 'MB'); }).catch(() => {});
}
function bindSettings() {
  SEG.theme = v => { Store.ui.theme = v; applyTheme(); Store.save(); };
  SW.lock = on => { if (on) enableLock(); else disableLock(); };
  $('#settings').addEventListener('click', e => {
    const t = e.target;
    if (t.closest('#sexport')) return exportBackup();
    if (t.closest('#simport')) { const f = $('#frestore'); f.value = ''; f.click(); return; }
    if (t.closest('#schange')) return changeCode();
    if (t.closest('#slocknow')) return lockNow();
    if (t.closest('#swipe')) return wipeAll();
  });
  $('#frestore').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) importBackup(f); };
}

/* ======================= app ======================= */
function renderAll() { renderList(); renderSettings(); if (Detail.id && Store.byId(Detail.id)) renderDetail(); else if (Detail.isOpen) Detail.close(); }
function openFromRow(e) {
  const r = e.target.closest('[data-id]'); if (!r) return;
  Detail.open(r.dataset.id, e.clientX || r.getBoundingClientRect().left + r.offsetWidth / 2, e.clientY || r.getBoundingClientRect().top + r.offsetHeight / 2);
}
function init() {
  $('#gear').innerHTML = gearSvg();
  Toast.init(); Pager.init(); Wallet.init(); Pull.init(); Detail.init(); bindDetail(); Editor.init(); Redeem.init(); Lock.init(); BcFull.init(); Viewer.init();
  Acts = new BottomSheet($('#acts'));
  $$('#pages .page').forEach(p => { const u = collapse(p, 'tab'); u(); });
  $('#list').addEventListener('click', e => {
    if (e.target.closest('#emptyadd')) return Editor.open(null);
    const lc = e.target.closest('[data-lcat]'); if (lc) { List.cat = List.cat === lc.dataset.lcat ? null : lc.dataset.lcat; renderList(); return; }
    const wc = e.target.closest('.wcard');
    if (wc) { if (performance.now() < Wallet.suppress) return; if (wc.dataset.id !== Wallet.front) { Wallet.setFront(wc.dataset.id); return; } }
    openFromRow(e);
  });
  $('#add').onclick = () => Editor.open(null);
  const q = $('#q'), qx = $('#qx');
  q.addEventListener('input', () => { qx.hidden = !q.value; renderList(); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); });
  qx.onclick = () => { q.value = ''; qx.hidden = true; renderList(); q.focus(); };
  bindSettings();
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement || document.activeElement === document.body) { if (scrollY || scrollX) scrollTo(0, 0); } }, 60));
  addEventListener('scroll', () => { if (scrollY || scrollX) scrollTo(0, 0); }, { passive: true });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  addEventListener('resize', () => { W = innerWidth; H = innerHeight; Pager.render(); Detail.tx.scale = W; Detail.ty.scale = H; });
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const kb = () => { const k = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)); [Editor.sheet, Redeem.sheet].forEach(s => s.setKb(k)); };
    vv.addEventListener('resize', kb); vv.addEventListener('scroll', kb);
  }
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); if (Store.locked && Store.key) $('#cover').style.visibility = 'visible'; }
    else {
      $('#cover').style.visibility = 'hidden';
      if (Store.locked && Store.key && Date.now() - hiddenAt > 60000) lockNow();
      else if (Store.ready) {
        renderList();
        const pc = BalanceCheck.pending; BalanceCheck.pending = null;
        if (pc && Date.now() - pc.t < 15 * 60000) { const v = Store.byId(pc.id); if (v && v.bal != null) setTimeout(() => Redeem.openBalance(v, true), 350); }
      }
    }
  });
}
async function boot() {
  Store.load(); applyTheme(); init();
  if (Store.locked) { renderAll(); await unlockFlow(true); }
  else { renderAll(); cleanupOrphans(); }
  navigator.storage?.persist?.().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') navigator.serviceWorker?.register('coupontracker-sw.js', { scope: './coupontracker' }).catch(() => {});
}
window.App = { Wallet, Store, Ticker, Spring, QR, C128, Detail, Pager, Editor, Viewer, Img, IDB };
boot();
</script>
